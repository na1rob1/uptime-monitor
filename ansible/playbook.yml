- name: Deploy uptime-monitor
  hosts: uptime
  become: true
  
  tasks:
    - name: Install docker.io
      apt:
        name: docker.io
        state: present
        update_cache: yes

    - name: Create cli plugins directory
      file:
        path: /usr/local/lib/docker/cli-plugins
        state: directory

    - name: Install docker compose v2 binary
      get_url:
        url: https://github.com/docker/compose/releases/download/v2.29.0/docker-compose-linux-x86_64
        dest: /usr/local/lib/docker/cli-plugins/docker-compose
        mode: '0755'
  
    - name: Ensure docker is running and enabled
      systemd:
        name: docker
        state: started
        enabled: yes
  
    - name: Create app directory
      file:
        path: /opt/uptime
        state: directory
        mode: '0755'
  
    - name: Copy migrations
      copy:
        src: ../migrations/
        dest: /opt/uptime/migrations/
  
    - name: Copy docker-compose.yml
      copy:
        src: docker-compose.yml
        dest: /opt/uptime/docker-compose.yml
  
    - name: Pull images and start services
      shell: docker compose pull && docker compose up -d
      args:
        chdir: /opt/uptime